# Flatpak manifest for local and CI builds. Build and install it with:
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#     --install-deps-from=flathub build-flatpak io.github.gornostal.econnect.yml
id: io.github.gornostal.econnect

# Granite, the elementary stylesheet and icons come from the BaseApp, so the
# app looks the same on elementary OS while running on the GNOME runtime.
base: io.elementary.BaseApp
base-version: tanit-26.08

runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

command: io.github.gornostal.econnect

finish-args:
  # Windowing and rendering.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Devices are discovered over UDP 1716 and talk over TCP 1716-1764 on the
  # local network. Without host networking the app cannot see any phone.
  - --share=network

  # Files arriving from a phone are written to the Downloads folder. Sending
  # files goes through the file chooser portal, so no other filesystem access
  # is needed. Taking a screenshot uses the screenshot portal.
  - --filesystem=xdg-download

  # Browsing an Android phone's photos mounts its SFTP server through the host
  # GVFS daemon. Dropping these two only costs the gallery preview.
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.gtk.vfs.*

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: econnect
    buildsystem: meson
    # Runs desktop-file-validate and appstreamcli validate after building.
    run-tests: true
    config-opts:
      # The headless test tool is a development aid, not part of the app.
      - -Dcli=false
    sources:
      - type: dir
        path: .
