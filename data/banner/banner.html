<!doctype html>
<html><head><meta charset="utf-8"><title>EConnect banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: transparent; }
  .hero {
    position: relative; width: 1280px; height: 640px; overflow: hidden; border-radius: 28px;
    font-family: "Inter Display", "Inter", sans-serif; color: #fff;
    background:
      radial-gradient(900px 600px at 0% 0%, #2f7bff 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 100%, #ff4fa3 0%, transparent 60%),
      radial-gradient(600px 500px at 75% 10%, #8b5cff 0%, transparent 65%),
      linear-gradient(135deg, #1a3bff 0%, #6a2cff 50%, #d02fa0 100%);
  }
  /* soft grid */
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(700px 500px at 30% 50%, #000 20%, transparent 80%);
  }
  /* glowing orbit echoing the logo */
  .orbit {
    position: absolute; left: -120px; top: 250px; width: 1500px; height: 300px;
    border: 3px solid rgba(255,255,255,.85); border-radius: 50%;
    transform: rotate(-12deg);
    box-shadow: 0 0 24px rgba(140,220,255,.9), inset 0 0 24px rgba(140,220,255,.6);
    filter: blur(.3px); opacity: .6;
    -webkit-mask-image: linear-gradient(90deg, transparent 30%, #000 50%); mask-image: linear-gradient(90deg, transparent 30%, #000 50%);
  }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 540px;
    display: flex; flex-direction: column; justify-content: center; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; }
  .brand img { width: 96px; height: 96px; filter: drop-shadow(0 12px 30px rgba(0,0,40,.45)); }
  .brand h1 { font-size: 76px; font-weight: 800; letter-spacing: -2.5px; line-height: 1;
    text-shadow: 0 6px 30px rgba(0,0,60,.35); }
  .tag { font-size: 35px; font-weight: 700; line-height: 1.12; letter-spacing: -.8px; margin-bottom: 18px; }
  .tag span {
    background: linear-gradient(90deg, #7ff3ff, #ffe27a 60%, #ff9ad5);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-family: "Inter", sans-serif; font-size: 19px; line-height: 1.45; color: rgba(255,255,255,.86);
    margin-bottom: 28px; max-width: 470px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; max-width: 500px; }
  .chip { font-family: "Inter", sans-serif; font-size: 15px; font-weight: 600;
    padding: 8px 15px; border-radius: 999px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35);
    backdrop-filter: blur(6px); box-shadow: 0 4px 14px rgba(0,0,40,.18); }

  .shots { position: absolute; right: -40px; top: 0; bottom: 0; width: 720px; z-index: 2; perspective: 1600px; }
  .shot { position: absolute; border-radius: 8px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(10,0,60,.55), 0 0 0 1px rgba(255,255,255,.25); }
  .shot img { display: block; width: 100%; }
  /* screenshots include transparent shadow margins: crop to the window */
  .shot.back  { width: 560px; right: 40px; top: 36px;  transform: rotateY(-14deg) rotateZ(3deg); opacity: .96; }
  .shot.front { width: 600px; right: 150px; top: 215px; transform: rotateY(-10deg) rotateZ(-3deg); }
  .crop { width: 100%; aspect-ratio: 1990 / 1363; overflow: hidden; position: relative; }
  .crop img { position: absolute; width: 105.33%; left: -2.74%; top: -2.27%; }

  .spark { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 18px 6px rgba(160,230,255,.9); z-index: 4; }
</style></head>
<body>
<div class="hero">
  <div class="orbit"></div>

  <div class="shots">
    <div class="shot back"><div class="crop"><img src="../screenshots/discovery.png"></div></div>
    <div class="shot front"><div class="crop"><img src="../screenshots/devices.png"></div></div>
  </div>

  <div class="spark" style="width:5px;height:5px;left:1180px;top:238px"></div>

  <div class="text">
    <div class="brand"><img src="../icons/logo.png"><h1>EConnect</h1></div>
    <div class="tag">Your phone and your desktop,<br><span>finally on speaking terms.</span></div>
    <div class="sub">A native GTK app that talks the KDE&nbsp;Connect protocol. Use the stock KDE&nbsp;Connect app on Android or iOS.</div>
    <div class="chips">
      <div class="chip">📋 Clipboard sync</div>
      <div class="chip">📁 Files &amp; links</div>
      <div class="chip">📸 Screenshots</div>
      <div class="chip">🖼️ Recent photos</div>
      <div class="chip">🔒 TLS-paired</div>
    </div>
  </div>
</div>
</body></html>
